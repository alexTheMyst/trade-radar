# eval/golden_headlines.yaml — frozen golden-set for classifier eval
#
# Each case: id (stable), headline (embedded verbatim), expected_pillar
# (matching thesis pillar name, or null for off-thesis), expected_direction
# (positive/negative/neutral, or null to skip the direction check).
#
# Rule: expected_pillar must match EXACTLY (a monetary_policy headline must
# classify under monetary_policy, not a null/other pillar). A case passes only
# if the classifier's pillar matches AND its direction matches when specified.
#
# set_version is bumped whenever the set changes materially — accuracy from a
# different set_version is not comparable.

set_version: 1

cases:
  - id: 1
    headline: "Federal Reserve cuts rates by 25 basis points, signals more easing ahead"
    expected_pillar: monetary_policy
    expected_direction: positive
  - id: 2
    headline: "Fed holds rates steady, Powell says balance sheet runoff to continue"
    expected_pillar: monetary_policy
    expected_direction: neutral
  - id: 3
    headline: "Surprise hawkish hold: Fed leaves rates unchanged, dot plot shows no cuts this year"
    expected_pillar: monetary_policy
    expected_direction: negative
  - id: 4
    headline: "CPI comes in hot at 4.2%, worst inflation print in a decade"
    expected_pillar: monetary_policy
    expected_direction: negative
  - id: 5
